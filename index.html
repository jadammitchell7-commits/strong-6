<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#800000">
<title>Strong 6 – 6-week gym tracker</title>
<style>
:root{
  --bg:#f8f5f5; --card:#fff; --ink:#221a1c; --muted:#6e6164; --line:#e6dcde;
  --accent:#800000; --accent-ink:#fff; --accent-soft:#f5e1e3; --warm:#b8860b; --ok:#800000;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#1a1214; --card:#261a1d; --ink:#f3eaec; --muted:#a8969a; --line:#3d2b30;
    --accent:#e8909c; --accent-ink:#2a0b10; --accent-soft:#3d1a21; --warm:#e0b84a; --ok:#e8909c;}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{padding:18px 16px 8px;max-width:720px;margin:0 auto}
h1{font-size:1.35rem;margin:0}
.sub{color:var(--muted);font-size:.9rem;margin-top:2px}
main{max-width:720px;margin:0 auto;padding:0 12px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:10px;padding:8px 12px;min-height:40px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--warm);outline-offset:1px}
.weekbar{display:flex;align-items:center;gap:8px}
.weekbar .label{flex:1;text-align:center}
.weekbar .label b{font-size:1.1rem}
.pill{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.pill.easy{background:#fff0e6;color:var(--warm)}
@media (prefers-color-scheme: dark){.pill.easy{background:#3a2518}}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.days button{padding:8px 6px;text-align:center;line-height:1.2}
.days button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.days small{display:block;opacity:.85;font-size:.72rem}
.ex h3{margin:0;font-size:1.05rem}
.ex .target{color:var(--muted);font-size:.9rem}
.cue{font-size:.85rem;color:var(--muted);margin:6px 0 0}
.hint{font-size:.85rem;margin:8px 0 0;padding:6px 10px;border-radius:8px;background:var(--accent-soft);color:var(--ink)}
table.sets{width:100%;border-collapse:collapse;margin-top:10px}
.sets th{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;font-weight:600;padding:0 4px 4px}
.sets td{padding:3px 4px}
.sets td.n{width:28px;color:var(--muted);font-weight:600}
input[type=number],textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%;min-height:42px}
input[type=number]{max-width:110px}
input[type=checkbox]{width:26px;height:26px;accent-color:var(--ok)}
textarea{min-height:64px;resize:vertical}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--ok);width:0}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1;border:0;border-radius:0;background:transparent;min-height:56px;color:var(--muted)}
nav.tabs button[aria-selected=true]{color:var(--accent);font-weight:700;box-shadow:inset 0 3px 0 var(--accent)}
table.grid{width:100%;border-collapse:collapse;font-size:.9rem}
.grid th,.grid td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
.grid td:first-child,.grid th:first-child{text-align:left}
.dot{display:inline-block;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);vertical-align:middle}
.dot.part{background:linear-gradient(90deg,var(--ok) 50%,transparent 50%);border-color:var(--ok)}
.dot.full{background:var(--ok);border-color:var(--ok)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
ul.tight{margin:.4rem 0;padding-left:1.2rem}
ul.tight li{margin:.2rem 0}
svg text{fill:var(--muted);font-size:10px}
.sr{position:absolute;left:-9999px}
details summary{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<header>
  <h1>Strong 6</h1>
  <div class="sub">6 weeks · Monday + Friday gym sessions · strength and power</div>
</header>
<main id="app"></main>
<nav class="tabs" role="tablist" aria-label="Sections">
  <button role="tab" data-tab="train">Train</button>
  <button role="tab" data-tab="progress">Progress</button>
  <button role="tab" data-tab="guide">Guide</button>
  <button role="tab" data-tab="data">Export</button>
</nav>

<script>
"use strict";
/* ---------- Program ---------- */
// load: label for the extra-load column (null = bodyweight only). prog: suggest weight bumps.
const WEEKS = 6;
// Weight suggestions: from week 2, previous weight +5%, rounded to a loadable weight.
// bar = fixed starting weight (e.g. trap bar), step = smallest total jump from there.
// Trap bar: 1.25 kg plates on each side = 2.5 kg total steps. Other lifts: DEFAULT_STEP.
const PLATES = [25,20,15,10,5,2.5,1.25];
const DEFAULT_STEP = 2.5; // kg: dumbbells go up in 2.5 kg steps
const BUMP = 0.05;
const DAYS = [
  { id:"mon", name:"Monday", focus:"Gym: lower body + power", ex:[
    {id:"m1a", label:"1a", name:"Trap bar deadlift", sets:3, reps:6, load:"kg", prog:true, bar:40, step:2.5, trial:60, loadNote:"Log the total weight including the 40 kg bar.", cue:"Flat back, push the floor away, stand tall. Control the way down. Every rep should look the same."},
    {id:"m1b", label:"1b", name:"Pogo jumps", sets:3, reps:10, load:null, cue:"Stiff ankles, quick springy contacts, tall posture. Think \"hot floor\"."},
    {id:"m2a", label:"2a", name:"Goblet squat", sets:3, reps:6, load:"kg", prog:true, step:2.5, trial:20, loadNote:"Dumbbell weight in kg (2.5 kg steps).", cue:"Dumbbell or kettlebell at your chest. Chest tall, sit between the hips, heels down."},
    {id:"m2b", label:"2b", name:"Medicine ball slam", sets:3, reps:5, load:"ball kg", cue:"Reach tall, slam hard into the floor using your whole body. Max effort every rep."},
    {id:"m3a", label:"3a", name:"Box jumps", sets:3, reps:5, load:"box cm", cue:"Jump up, land softly and fully on the box, stand up, then step down. Reset between reps."},
    {id:"m3b", label:"3b", name:"Leg raises", sets:3, reps:8, load:null, cue:"Lower back stays pressed down. Slow on the way down, no swinging."}
  ]},
  { id:"fri", name:"Friday", focus:"Gym: single leg + power", ex:[
    {id:"f1a", label:"1a", name:"Single leg deadlift", sets:3, reps:8, perLeg:true, load:"kg", prog:true, weights:[20,24,28,32], loadNote:"Kettlebell weight in kg (gym has 20, 24, 28, 32).", cue:"Hold a kettlebell. Hinge at the hip, back leg reaches long, flat back, hips square. Light weight until balance is solid. Do all reps on one leg, then switch."},
    {id:"f1b", label:"1b", name:"Broad jumps", sets:3, reps:5, load:"cm", cue:"Swing arms, jump forward, stick the landing for a second. Log your distance if you measure it."},
    {id:"f2a", label:"2a", name:"Bulgarian split squat", sets:3, reps:5, perLeg:true, load:"kg", prog:true, step:2.5, loadNote:"Dumbbell weight in kg (2.5 kg steps).", cue:"Back foot on a bench, front knee tracks over the toes, drop straight down. Do all reps on one leg, then switch."},
    {id:"f2b", label:"2b", name:"Pogo jumps", sets:3, reps:10, load:null, cue:"Stiff ankles, quick springy contacts, tall posture."},
    {id:"f3a", label:"3a", name:"Weighted seated jumps", sets:3, reps:3, repText:"3 weighted + 1 no weight", load:"kg", cue:"Sit on a box, jump up from a dead start. Do 3 reps holding the weight, then rep 4 without it. Log the weighted reps."},
    {id:"f3b", label:"3b", name:"Ab rollout", sets:3, reps:8, load:null, cue:"Brace the core, roll out only as far as your lower back stays flat. Stop before it sags."}
  ]}
];
const ALL_EX = DAYS.flatMap(d => d.ex.map(e => ({...e, day:d.id})));
const targetText = ex => ex.sets + " × " + (ex.repText || ex.reps) + (ex.perLeg ? " / leg" : "");

/* ---------- State ---------- */
const KEY = "strong6-v1";
const DEFAULTS = () => ({week:1, day:0, tab:"train", logs:{}, notes:{}});
let S;
try { S = Object.assign(DEFAULTS(), JSON.parse(localStorage.getItem(KEY) || "{}")); } catch(e){ S = DEFAULTS(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const lk = (w,exId) => `${w}|${exId}`;
function getLog(w,exId){ return S.logs[lk(w,exId)]; }
function ensureLog(w,exId,n){
  const k = lk(w,exId);
  const log = S.logs[k] || (S.logs[k] = {sets:[]});
  while(log.sets.length < n) log.sets.push({w:"", r:"", done:false});
  return log;
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : null; };

/* ---------- Helpers ---------- */
function lastBest(exId, week){
  for(let w=week-1; w>=1; w--){
    const log = getLog(w, exId);
    if(!log) continue;
    const done = log.sets.filter(s => s.done);
    if(!done.length) continue;
    const best = done.reduce((a,b) => ((num(b.w)||0) > (num(a.w)||0) || ((num(b.w)||0)===(num(a.w)||0) && (num(b.r)||0)>(num(a.r)||0))) ? b : a);
    return {week:w, best, sets:done};
  }
  return null;
}
function nextUp(ex, prev){
  if(ex.weights){ const n = ex.weights.find(x => x > prev + 1e-9); return n === undefined ? null : n; }
  return prev + (ex.step || DEFAULT_STEP);
}
function suggestLoad(ex, prev){
  if(ex.weights){
    const t = prev * (1 + BUMP);
    return ex.weights.reduce((a,b) => Math.abs(b-t) < Math.abs(a-t) ? b : a);
  }
  const bar = ex.bar || 0, step = ex.step || DEFAULT_STEP;
  const v = Math.round((prev*(1+BUMP) - bar) / step) * step + bar;
  return Math.max(v, bar);
}
function plateText(total, bar){
  let side = (total - bar) / 2;
  if(side < 0.001) return "bar only";
  const out = [];
  for(const p of PLATES){ while(side >= p - 1e-9){ out.push(p); side -= p; } }
  return out.join(" + ") + " each side";
}
const fmt = n => String(+n.toFixed(2));
function dayCompletion(w, day){
  let total=0, done=0;
  day.ex.forEach(ex => {
    total += ex.sets;
    const log = getLog(w, ex.id);
    if(log) done += Math.min(ex.sets, log.sets.filter(s => s.done).length);
  });
  return total ? done/total : 0;
}
function topLoad(w, exId){
  const log = getLog(w, exId); if(!log) return null;
  const ws = log.sets.filter(s => s.done && num(s.w)!==null).map(s => num(s.w));
  return ws.length ? Math.max(...ws) : null;
}

/* ---------- Rendering ---------- */
const app = document.getElementById("app");
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab===S.tab));
  ({train:renderTrain, progress:renderProgress, guide:renderGuide, data:renderData})[S.tab]();
}

function renderTrain(){
  const w = S.week, day = DAYS[S.day];
  const pct = Math.round(dayCompletion(w, day)*100);
  let html = `
  <div class="card">
    <div class="weekbar">
      <button id="prevW" aria-label="Previous week" ${w<=1?"disabled":""}>‹</button>
      <div class="label"><b>Week ${w} of ${WEEKS}</b></div>
      <button id="nextW" aria-label="Next week" ${w>=WEEKS?"disabled":""}>›</button>
    </div>
    <p class="small muted" style="margin:10px 0 0">Same sets and reps every week. The goal is better quality and a little more load or height when it feels easy and looks clean.</p>
    <div class="days" role="group" aria-label="Workout day" style="grid-template-columns:repeat(2,1fr)">
      ${DAYS.map((d,i)=>`<button data-day="${i}" aria-pressed="${i===S.day}">${d.name}<small>${d.focus.replace("Gym: ","")}</small></button>`).join("")}
    </div>
  </div>
  <div class="card">
    <div class="row between"><b>${day.name}</b><span class="small muted">${pct}% done</span></div>
    <div class="progress" aria-hidden="true"><i style="width:${pct}%"></i></div>
    <details style="margin-top:10px"><summary>Warm-up (8–10 min)</summary>
      <ul class="tight small">
        <li>3–5 min easy cardio (bike, row, skipping)</li>
        <li>10 bodyweight squats, 10 hip hinges, 10 leg swings each leg, 10 arm circles</li>
        <li>A few low pogo hops and one easy practice jump</li>
        <li>1–2 light warm-up sets of the first lift</li>
      </ul></details>
    <p class="small muted" style="margin:10px 0 0">Pairs: do <b>a</b>, rest about 60–90 sec, do <b>b</b>, rest, repeat for 3 rounds. Then move on to the next pair.</p>
  </div>`;
  day.ex.forEach(ex => {
    const log = getLog(w, ex.id);
    const rows = Math.max(ex.sets, log ? log.sets.length : 0);
    const last = lastBest(ex.id, w);
    let hint = "", sugg = null, bonus = false;
    let prevW = null, label = "", hitAll = true, bestTxt = "";
    if(last){
      prevW = num(last.best.w);
      hitAll = last.sets.length >= ex.sets && last.sets.every(s => (num(s.r)||0) >= ex.reps);
      bestTxt = (last.best.w!=="" && ex.load ? esc(last.best.w)+" "+ex.load+" × " : "") + esc(last.best.r || ex.reps) + (ex.load===null ? " reps" : "");
      label = `Last time (week ${last.week})`;
    } else if(ex.trial){
      prevW = ex.trial; bestTxt = fmt(ex.trial) + " kg"; label = "Trial run";
    }
    if(last || ex.trial){
      const plates = v => ex.bar ? `<br><span class="muted">Plates: ${plateText(v, ex.bar)}</span>` : "";
      const btn = v => ` <button data-fill="${ex.id}|${v}" style="margin-top:6px;min-height:34px">Use ${fmt(v)} kg</button>`;
      hint = `${label}: <b>${bestTxt}</b>`;
      if(ex.prog && prevW!==null && prevW>0){
        if(!last && w===1){
          sugg = prevW;
          hint += `<br>Start at <b>${fmt(prevW)} kg</b>` + plates(prevW) + btn(prevW);
        } else {
          sugg = suggestLoad(ex, prevW);
          if(sugg > prevW){
            hint += `<br>Suggested today: <b>${fmt(sugg)} kg</b> (+5%, rounded to what the gym can load)` + plates(sugg) +
                    (hitAll ? "" : `<br><span class="muted">Not every rep was done last time, so repeating ${fmt(prevW)} kg is fine too.</span>`) + btn(sugg);
          } else {
            sugg = prevW; bonus = true;
            const nx = nextUp(ex, prevW);
            hint += `<br>5% more rounds to the same weight, so repeat <b>${fmt(prevW)} kg</b> and add 1 rep on the 3rd set (aim for <b>${ex.reps+1}</b>).` +
                    (nx!==null ? `<br><span class="muted">Next weight up is ${fmt(nx)} kg (+${Math.round((nx/prevW-1)*100)}%). Move up once every rep of every set is clean.</span>` : `<br><span class="muted">That's the heaviest available.</span>`) + btn(prevW);
          }
        }
      } else if(last && ex.load==="box cm" && hitAll){
        hint += " · Only go higher if landings are quiet and balanced.";
      } else if(last){
        hint += " · Match it or beat it with better form.";
      }
    }
    html += `<div class="card ex" data-ex="${ex.id}">
      <div class="row between wrap"><h3><span class="pill">${ex.label}</span> ${esc(ex.name)}</h3>
        <span class="target">${esc(targetText(ex))}${bonus ? ` (set 3: ${ex.reps+1})` : ""}</span></div>
      <p class="cue">${esc(ex.cue)}</p>
      ${ex.loadNote ? `<p class="cue"><b>${esc(ex.loadNote)}</b></p>` : ""}
      ${hint ? `<p class="hint">${hint}</p>` : ""}
      <table class="sets"><thead><tr><th>Set</th><th>${ex.load ? esc(ex.load) : "Load"}</th><th>Reps</th><th>Done</th></tr></thead><tbody>`;
    for(let i=0;i<rows;i++){
      const s = (log && log.sets[i]) || {w:"",r:"",done:false};
      const loadCell = ex.load
        ? `<input type="number" inputmode="decimal" step="any" min="0" placeholder="${sugg!==null?fmt(sugg):(last&&last.best.w!==""?esc(last.best.w):"")}" value="${esc(s.w)}" data-ex="${ex.id}" data-i="${i}" data-f="w" aria-label="${esc(ex.name)} set ${i+1} ${esc(ex.load)}">`
        : `<span class="muted small">BW</span>`;
      html += `<tr><td class="n">${i+1}</td>
        <td>${loadCell}</td>
        <td><input type="number" inputmode="numeric" step="1" min="0" placeholder="${bonus && i===2 ? ex.reps+1 : ex.reps}" value="${esc(s.r)}" data-ex="${ex.id}" data-i="${i}" data-f="r" aria-label="${esc(ex.name)} set ${i+1} reps"></td>
        <td><input type="checkbox" ${s.done?"checked":""} data-ex="${ex.id}" data-i="${i}" data-f="done" aria-label="${esc(ex.name)} set ${i+1} done"></td></tr>`;
    }
    html += `</tbody></table>
      <div class="row" style="margin-top:6px"><button data-addset="${ex.id}">+ Add set</button></div>
    </div>`;
  });
  const dayNote = (S.notes[`${w}|${day.id}`]) || "";
  html += `<div class="card"><label for="dnote"><b>How did it feel?</b></label>
    <p class="small muted" style="margin:2px 0 8px">Energy, sleep, anything that hurt, wins worth remembering.</p>
    <textarea id="dnote" data-note="${w}|${day.id}">${esc(dayNote)}</textarea></div>`;
  app.innerHTML = html;
}

function renderProgress(){
  const loaded = ALL_EX.filter(e => e.load);
  const sel = loaded.find(e=>e.id===S.chartEx) ? S.chartEx : loaded[0].id;
  const ex = loaded.find(e => e.id===sel);
  const pts = [];
  for(let w=1; w<=WEEKS; w++){ const t = topLoad(w, sel); if(t!==null) pts.push({w, v:t}); }
  const W=320,H=170,pl=34,pr=10,pt=10,pb=24;
  const maxV = Math.max(10, ...pts.map(p=>p.v)); const top = Math.ceil(maxV*1.15/5)*5;
  const x = w => pl + (w-1)*(W-pl-pr)/(WEEKS-1), y = v => H-pb - v/top*(H-pt-pb);
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Top ${esc(ex.load)} per week for ${esc(ex.name)}">`;
  for(let i=0;i<=4;i++){ const v = top*i/4; svg += `<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-4}" y="${y(v)+3}" text-anchor="end">${Math.round(v)}</text>`; }
  for(let w=1; w<=WEEKS; w++) svg += `<text x="${x(w)}" y="${H-8}" text-anchor="middle">${w}</text>`;
  if(pts.length){
    svg += `<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${pts.map(p=>`${x(p.w)},${y(p.v)}`).join(" ")}"/>`;
    pts.forEach(p => svg += `<circle cx="${x(p.w)}" cy="${y(p.v)}" r="4" fill="var(--accent)"><title>Week ${p.w}: ${p.v} ${esc(ex.load)}</title></circle>`);
  } else svg += `<text x="${W/2}" y="${H/2}" text-anchor="middle">Log some sets to see your line</text>`;
  svg += `</svg>`;
  const first = pts[0], lastp = pts[pts.length-1];
  const change = (first && lastp && lastp.w!==first.w) ? `${lastp.v-first.v>=0?"+":""}${+(lastp.v-first.v).toFixed(1)} ${ex.load} since week ${first.w}` : "";

  let totalDone=0;
  const grid = [];
  for(let w=1; w<=WEEKS; w++){
    const cells = DAYS.map(d => dayCompletion(w,d));
    cells.forEach(c => { if(c>=0.8) totalDone++; });
    grid.push(`<tr><td>Week ${w}</td>${cells.map(c=>`<td><span class="dot ${c>=0.8?"full":c>0?"part":""}" title="${Math.round(c*100)}%"></span></td>`).join("")}</tr>`);
  }
  const total = WEEKS*DAYS.length;
  app.innerHTML = `
  <div class="card"><div class="row between"><b>Workouts finished</b><span><b>${totalDone}</b> <span class="muted">/ ${total}</span></span></div>
    <div class="progress" aria-hidden="true"><i style="width:${Math.round(totalDone/total*100)}%"></i></div>
    <table class="grid" style="margin-top:10px"><thead><tr><th></th>${DAYS.map(d=>`<th>${d.name}</th>`).join("")}</tr></thead><tbody>${grid.join("")}</tbody></table>
    <p class="small muted">Filled = 80%+ of sets done. Half = started.</p></div>
  <div class="card"><label for="chartEx"><b>Top load by week</b></label>
    <select id="chartEx" style="margin:8px 0">${loaded.map(e=>`<option value="${e.id}" ${e.id===sel?"selected":""}>${esc(e.name)} (${esc(e.load)})</option>`).join("")}</select>
    ${svg}<p class="small muted" style="margin:4px 0 0">${change || "Biggest completed load each week (" + esc(ex.load) + ")."}</p></div>`;
}

function renderGuide(){
  app.innerHTML = `
  <div class="card"><b>How this works</b>
    <ul class="tight small">
      <li><b>Monday and Friday</b> are gym days, about 60 minutes each. Keep at least one rest day between them.</li>
      <li>Each day has 3 pairs. Do <b>a</b>, rest 60–90 sec, do <b>b</b>, rest, and repeat for 3 rounds. Rest about 2 minutes after heavy deadlifts and squats.</li>
      <li>Same sets and reps for all 6 weeks. Log the weight (or box height / jump distance) each set and tick it off.</li>
      <li><b>Strength lifts</b> (6 reps): pick a weight that leaves 1–2 reps in the tank. When you get every rep with clean form, add a little next time.</li>
      <li><b>Jumps and throws</b>: quality over fatigue. Fresh, fast, powerful reps. If landings get loud or sloppy, stop the set.</li>
    </ul></div>
  <div class="card"><b>Safety</b>
    <ul class="tight small">
      <li>Train with a coach, parent or experienced adult nearby, especially for trap bar deadlifts, box jumps and weighted jumps.</li>
      <li>Land softly on both feet with knees bent, in flat supportive shoes. Always step down from the box, don't jump down.</li>
      <li>Use a stable box and a clear landing area. Start low and build height slowly.</li>
      <li>Sharp or joint pain means stop. Muscle burn and tiredness are normal.</li>
      <li>Eat enough, drink water and sleep 8–10 hours. Fueling matters more than the program.</li>
      <li>If you have a medical condition or an injury, check with a doctor before starting.</li>
    </ul></div>`;
}

function renderData(){
  app.innerHTML = `
  <div class="card"><b>Export to a spreadsheet</b>
    <p class="small muted">Downloads a CSV with every set you've logged. It opens in Excel, Numbers and Google Sheets.</p>
    <button class="primary" id="csv">Download CSV</button></div>
  <div class="card"><b>Back up and restore</b>
    <p class="small muted">Your log is saved in this browser on this device only. Download a backup now and then, or to move to a new phone.</p>
    <div class="row wrap"><button id="bk">Download backup</button>
    <button id="rs">Restore backup…</button><input id="file" type="file" accept="application/json" class="sr" tabindex="-1"></div></div>
  <div class="card"><b>Start over</b>
    <p class="small muted">Erases everything logged on this device.</p>
    <button id="wipe">Erase my log</button></div>`;
}

/* ---------- Export ---------- */
function download(name, text, mime){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type:mime}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function csvCell(v){ v = String(v ?? ""); return /[",\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function buildCSV(){
  const rows = [["Week","Day","Exercise","Set","Load","Load unit","Reps","Target","Done","Day notes"]];
  for(let w=1; w<=WEEKS; w++) DAYS.forEach(d => {
    let noteUsed = false;
    d.ex.forEach(ex => {
      const log = getLog(w, ex.id); if(!log) return;
      log.sets.forEach((s,i) => {
        if(s.w==="" && s.r==="" && !s.done) return;
        const note = noteUsed ? "" : (S.notes[`${w}|${d.id}`]||""); noteUsed = true;
        rows.push([w, d.name, ex.label+" "+ex.name, i+1, s.w, s.w!==""?(ex.load||""):"", s.r, targetText(ex), s.done?"yes":"no", note]);
      });
    });
  });
  return "﻿" + rows.map(r => r.map(csvCell).join(",")).join("\r\n");
}

/* ---------- Events ---------- */
document.querySelector("nav.tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if(!b) return;
  S.tab = b.dataset.tab; save(); render(); window.scrollTo(0,0);
});
app.addEventListener("click", e => {
  const t = e.target.closest("button"); if(!t) return;
  if(t.id==="prevW"){ S.week = Math.max(1,S.week-1); save(); render(); }
  else if(t.id==="nextW"){ S.week = Math.min(WEEKS,S.week+1); save(); render(); }
  else if(t.dataset.day!==undefined){ S.day = +t.dataset.day; save(); render(); }
  else if(t.dataset.fill){
    const [id, val] = t.dataset.fill.split("|"); const ex = ALL_EX.find(x=>x.id===id);
    const log = ensureLog(S.week, id, ex.sets);
    log.sets.forEach(st => { if(st.w==="") st.w = val; }); save(); render();
  }
  else if(t.dataset.addset){
    const ex = ALL_EX.find(x=>x.id===t.dataset.addset);
    const log = ensureLog(S.week, ex.id, ex.sets); log.sets.push({w:"",r:"",done:false}); save(); render();
  }
  else if(t.id==="csv") download(`strong6-log-${new Date().toISOString().slice(0,10)}.csv`, buildCSV(), "text/csv;charset=utf-8");
  else if(t.id==="bk") download(`strong6-backup-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(S), "application/json");
  else if(t.id==="rs") document.getElementById("file").click();
  else if(t.id==="wipe"){ if(confirm("Erase your whole log on this device? This can't be undone.")){ S = DEFAULTS(); save(); render(); } }
});
app.addEventListener("input", e => {
  const el = e.target;
  if(el.dataset.note){ S.notes[el.dataset.note] = el.value; save(); return; }
  if(el.dataset.f && el.dataset.f!=="done"){
    const ex = ALL_EX.find(x=>x.id===el.dataset.ex);
    const log = ensureLog(S.week, ex.id, ex.sets);
    log.sets[+el.dataset.i][el.dataset.f] = el.value; save();
  }
});
app.addEventListener("change", e => {
  const el = e.target;
  if(el.id==="chartEx"){ S.chartEx = el.value; save(); render(); return; }
  if(el.id==="file"){
    const f = el.files[0]; if(!f) return;
    f.text().then(txt => {
      try{ const d = JSON.parse(txt); if(!d || typeof d!=="object" || !d.logs) throw 0;
        S = Object.assign(DEFAULTS(), d); save(); S.tab="train"; render(); alert("Backup restored.");
      }catch(err){ alert("That doesn't look like a Strong 6 backup file."); }
    });
    return;
  }
  if(el.dataset.f==="done"){
    const ex = ALL_EX.find(x=>x.id===el.dataset.ex);
    const log = ensureLog(S.week, ex.id, ex.sets);
    log.sets[+el.dataset.i].done = el.checked; save(); render();
  }
});

render();
</script>
</body>
</html>
